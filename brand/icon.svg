  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(0.94) translate(-54 -54)">
    <path d="M54 37 V28" fill="none" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="54" cy="25" r="5.2" fill="#E9B949"/>
    <rect x="27" y="37" width="54" height="44" rx="19" fill="#F4F1E8"/>
    <rect x="41" y="51" width="7.5" height="14" rx="3.75" fill="#123F30"/>
    <rect x="59.5" y="51" width="7.5" height="14" rx="3.75" fill="#123F30"/>
