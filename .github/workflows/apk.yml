# Builds the update APK, signed with the same key as the APK on the phone, plus the root-manager
# update package, and publishes both as a GitHub release named after the app version.
#
# One-time setup: repository secret ANDROID_KEYSTORE_BASE64 = base64 of apk/debug.keystore from
# the machine that built the APK installed on the phone (see README). Android only accepts an
# update signed with the key the app was installed with.
#
# The Linux payload (rootfs.tar.xz) is not in the repository, so these APKs update an existing
# install; setting up a new phone still needs the full APK built locally.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Without the original signing key the APK cannot update an installed DroidAgent — see README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > apk/debug.keystore

      - name: Build APK
        working-directory: apk
        env:
          BUILD_TOOLS_VERSION: 34.0.0
          ANDROID_PLATFORM: android-34
        run: python3 build.py

      - name: Build root-manager update package
        run: python3 tools/build_update_zip.py

      - name: Collect outputs
        id: out
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' apk/AndroidManifest.xml | head -n 1)
          mkdir -p dist
          cp apk/DroidAgent.apk "dist/DroidAgent-$VERSION.apk"
          cp DroidAgent-update.zip "dist/DroidAgent-update-$VERSION.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DroidAgent-${{ steps.out.outputs.version }}
          path: dist/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.out.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          TAG="v$VERSION"
          # This version's section of CHANGELOG.md, shown on the release and in the app after updating.
          awk -v v="$VERSION" '$0 ~ "^## " { f = ($2 == v); next } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "（CHANGELOG.md 里没有 $VERSION 的说明）" > notes.md
          printf '\n---\n已经装好 DroidAgent 的手机会自动更新；也可以下载 DroidAgent-%s.apk 直接安装（约 7 MB，不含 Linux 系统，第一次安装请用完整版），或在 Root 管理器里刷入 DroidAgent-update-%s.zip。\n' "$VERSION" "$VERSION" >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$EVENT" = workflow_dispatch ]; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --notes-file notes.md
            else
              # Phones only install a higher version, so replacing this one's files would never
              # reach them — and would make two different builds share one version number.
              echo "::warning::v$VERSION is already published; bump versionName/versionCode in apk/AndroidManifest.xml (and add a CHANGELOG.md section) to ship this push."
            fi
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "DroidAgent $VERSION（更新包）" --notes-file notes.md --prerelease
          fi
