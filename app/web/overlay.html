<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>助手状态</title>
<style>
	/* The floating panel: always dark, in the app's green-black, read at a glance over any app. */
	:root {
		--bg: #101815; --surface: #17211D; --surface2: #1E2A25; --line: #26332D;
		--text: #E8EEEA; --muted: #A2B0A8; --faint: #6D7B74;
		--accent: #E9B949; --ok: #5FD3A6; --warn: #E9B949; --danger: #EF8A80;
	}
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { height: 100%; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 13px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans", sans-serif;
		display: flex; flex-direction: column; overflow: hidden;
	}
	svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

	header { display: flex; align-items: center; gap: 10px; padding: 12px 10px 10px 14px; flex: none; }
	.state { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
	.state.run { background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
	.state.wait { background: var(--warn); animation: pulse .8s ease-in-out infinite; }
	@keyframes pulse { 50% { opacity: .35; } }
	.head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
	#title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#sub.wait { color: var(--warn); }
	.icon-btn { width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }
	.icon-btn:active { background: var(--surface2); }

	#feed { flex: 1; overflow-y: auto; padding: 2px 14px 12px; overscroll-behavior: contain; }
	.empty { color: var(--faint); text-align: center; padding: 36px 10px; font-size: 12.5px; }
	.step { display: flex; gap: 9px; padding: 7px 0; align-items: flex-start; }
	.step .ic { margin-top: 2px; color: var(--faint); }
	.step .body { flex: 1; min-width: 0; word-break: break-word; }
	.step.user .body { color: var(--text); background: var(--surface2); border-radius: 12px; padding: 7px 10px; }
	.step.tool .body { color: var(--muted); }
	.step.tool.err .body { color: var(--danger); }
	.step.tool.running .ic { color: var(--ok); }
	.step.reply .body { color: var(--text); white-space: pre-wrap; }
	.step.note .body { color: var(--faint); font-size: 12px; }
	details.think { color: var(--muted); }
	details.think summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; }
	details.think summary::-webkit-details-marker { display: none; }
	details.think .t { margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line); white-space: pre-wrap; font-size: 12.5px; }
	.perm { background: var(--surface); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 14px; padding: 10px 12px; margin: 6px 0; }
	.perm .what { font-weight: 600; }
	.perm pre { margin: 6px 0 0; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 7.5em; overflow: auto; }
	.perm .btns { display: flex; gap: 8px; margin-top: 10px; }
	.perm .verdict { margin-top: 6px; color: var(--faint); font-size: 12px; }
	button.pill { flex: 1; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; }
	button.pill.yes { background: var(--accent); border-color: var(--accent); color: #1B1606; }
	button.pill:active { filter: brightness(.9); }
	.queue { color: var(--faint); font-size: 12px; padding: 6px 0 0; }

	footer { flex: none; padding: 8px 12px 12px; display: flex; }
	footer button { flex: 1; height: 38px; border-radius: 12px; border: 0; background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
	footer button:active { background: var(--line); }
</style>
</head>
<body>
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
		<symbol id="i-tool" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></symbol>
		<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
		<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M6.3 17.7l2.8-2.8M14.9 9.1l2.8-2.8"/></symbol>
		<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></symbol>
		<symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
		<symbol id="i-note" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></symbol>
	</svg>
	<header>
		<i id="state" class="state"></i>
		<div class="head-text"><span id="title">连接中…</span><span id="sub"></span></div>
		<button id="btn-close" class="icon-btn" aria-label="收起"><svg class="ic"><use href="#i-x"/></svg></button>
	</header>
	<div id="feed"><div class="empty">正在读取…</div></div>
	<footer><button id="btn-open"><svg class="ic"><use href="#i-open"/></svg>打开这段对话</button></footer>

<script>
'use strict';
/* What the agent is doing, for someone looking at another app. The server says which conversation
   matters (/api/overlay/state); live events for that one fill in between. */
const $ = (s) => document.querySelector(s);
const feed = $('#feed');
const ic = (id) => `<svg class="ic"><use href="#${id}"/></svg>`;
let state = null;         // last /api/overlay/state
let liveText = null;      // the reply being written: { el, text }
let liveThink = null;     // the thinking being written: { el, text }
let refreshTimer = null;
let ticker = null;

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function secs(ms) { const t = Math.max(0, Math.round(ms / 1000)); return t < 60 ? `${t} 秒` : `${Math.floor(t / 60)} 分 ${String(t % 60).padStart(2, '0')} 秒`; }
const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
function follow(change) { const stick = nearBottom(); change(); if (stick) feed.scrollTop = feed.scrollHeight; }

function header() {
	const s = state;
	const dot = $('#state'), sub = $('#sub');
	dot.className = 'state' + (s?.waiting ? ' wait' : s?.running ? ' run' : '');
	$('#title').textContent = s?.id ? s.title : '还没有对话';
	sub.classList.toggle('wait', !!s?.waiting);
	let text;
	if (!s?.id) text = '';
	else if (s.waiting) text = '等你确认';
	else if (s.running) text = `${s.label || '正在思考'} · ${secs(Date.now() - (s.since || Date.now()))}`;
	else text = '已完成';
	if (s?.others) text += `，另有 ${s.others} 个对话在进行`;
	sub.textContent = text;
}

function stepHtml(st) {
	if (st.k === 'user') return `<div class="step user"><div class="body">${esc(st.text)}</div></div>`;
	if (st.k === 'reply') return `<div class="step reply">${ic('i-chat')}<div class="body">${esc(st.text)}</div></div>`;
	if (st.k === 'think') return `<div class="step">${ic('i-spark')}<details class="think body"><summary>思考了 ${secs(st.ms || 1000)}</summary><div class="t">${esc(st.text)}</div></details></div>`;
	if (st.k === 'note') return `<div class="step note">${ic('i-note')}<div class="body">${esc(st.text)}</div></div>`;
	if (st.k === 'tool') {
		const cls = st.state === 'err' ? ' err' : st.state === 'running' ? ' running' : '';
		return `<div class="step tool${cls}">${ic(st.state === 'running' ? 'i-spark' : st.state === 'err' ? 'i-x' : 'i-check')}<div class="body">${esc(st.title)}</div></div>`;
	}
	if (st.k === 'perm') {
		const verdict = { allow: '已允许', deny: '已拒绝', stop: '已停止', expired: '已失效' }[st.verdict];
		return `<div class="perm" data-id="${esc(st.id)}"><div class="what">${esc(st.title)}</div>${st.detail ? `<pre>${esc(st.detail)}</pre>` : ''}`
			+ (verdict ? `<div class="verdict">${verdict}</div>` : '<div class="btns"><button class="pill yes" data-d="allow">允许</button><button class="pill" data-d="deny">拒绝</button></div>')
			+ '</div>';
	}
	return '';
}

function render() {
	liveText = null; liveThink = null;
	const s = state;
	if (!s?.id) { feed.innerHTML = '<div class="empty">还没有进行中的任务</div>'; header(); return; }
	let html = s.steps.map(stepHtml).join('');
	if (s.queue?.length) html += `<div class="queue">还有 ${s.queue.length} 条消息排队：${esc(s.queue[0])}${s.queue.length > 1 ? ' …' : ''}</div>`;
	feed.innerHTML = html || '<div class="empty">刚开始</div>';
	if (s.liveThinking) thinking(s.liveThinking);
	if (s.liveText) reply(s.liveText);
	header();
	feed.scrollTop = feed.scrollHeight;
}

function thinking(delta) {
	if (!liveThink) {
		const el = document.createElement('div');
		el.className = 'step';
		el.innerHTML = `${ic('i-spark')}<details class="think body" open><summary>正在思考</summary><div class="t"></div></details>`;
		feed.appendChild(el);
		liveThink = { el: el.querySelector('.t'), text: '' };
	}
	liveThink.text += delta;
	follow(() => { liveThink.el.textContent = liveThink.text; });
}
function reply(delta) {
	if (!liveText) {
		liveThink = null;
		if (state?.running && !state.waiting) { state.label = '正在回复'; header(); }
		const el = document.createElement('div');
		el.className = 'step reply';
		el.innerHTML = `${ic('i-chat')}<div class="body"></div>`;
		feed.appendChild(el);
		liveText = { el: el.querySelector('.body'), text: '' };
	}
	liveText.text += delta;
	follow(() => { liveText.el.textContent = liveText.text; });
}

async function refresh() {
	clearTimeout(refreshTimer); refreshTimer = null;
	try {
		const r = await fetch('/api/overlay/state', { cache: 'no-store' }).then((x) => x.json());
		if (r.ok) { state = r; render(); }
	} catch { $('#sub').textContent = '连不上助手服务'; }
}
// Many events come in a burst: one fresh read after them is enough.
function refreshSoon() { if (!refreshTimer) refreshTimer = setTimeout(refresh, 250); }

function connect() {
	const es = new EventSource('/api/events');
	es.onopen = refresh; // after a reconnect too: what happened meanwhile
	es.onerror = () => { $('#state').className = 'state'; $('#sub').textContent = '连接断开，正在重连'; };
	es.onmessage = (e) => {
		let m; try { m = JSON.parse(e.data); } catch { return; }
		if (!m.sessionId) return;
		const mine = state?.id === m.sessionId;
		switch (m.type) {
			case 'thinking_delta': if (mine) thinking(m.text || ''); break;
			case 'assistant_delta': if (mine) reply(m.text || ''); break;
			// A new step, a turn starting or ending, a question for the owner: read the state again,
			// which also follows the work to another conversation.
			case 'user_echo': case 'tool_use': case 'tool_result': case 'assistant_end': case 'assistant_text': case 'thinking_end':
			case 'permission': case 'permission_resolved': case 'result': case 'error': case 'queue': case 'title': case 'notice':
				refreshSoon();
				break;
		}
	};
}

feed.addEventListener('click', async (e) => {
	const b = e.target.closest('.perm button');
	if (!b || !state?.id) return;
	const card = b.closest('.perm');
	card.querySelectorAll('button').forEach((x) => { x.disabled = true; });
	await fetch('/api/permission', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: card.dataset.id, decision: b.dataset.d, sessionId: state.id }) }).catch(() => {});
	refreshSoon();
});
// The host app catches these addresses: one folds the panel, the other brings the chat forward.
$('#btn-close').onclick = () => { location.href = 'k70u://close-panel'; };
$('#btn-open').onclick = async () => {
	if (state?.id) await fetch('/api/sessions/switch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: state.id }) }).catch(() => {});
	location.href = 'k70u://open-chat';
};
// The panel is kept alive while folded; the app calls this when it unfolds it.
window.panelShown = refresh;

connect();
ticker = setInterval(() => { if (state?.running && !state.waiting) header(); }, 1000);
</script>
</body>
</html>
