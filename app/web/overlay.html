<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>助手状态</title>
<style>
	:root {
		/* the floating panel is always dark, in the app's green-black */
		--bg: #111A16; --surface: #18231E; --line: #26332D;
		--text: #E6ECE8; --muted: #9AA8A0; --faint: #67756E;
		--accent: #E2B33C; --ok: #5FD3A6; --warn: #E2B33C;
	}
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { height: 100%; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 13px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans", sans-serif;
		display: flex; flex-direction: column; overflow: hidden;
	}

	header {
		display: flex; align-items: center; gap: 8px;
		padding: 10px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
	}
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
	.dot.run { background: var(--ok); animation: pulse 1.1s infinite; }
	.dot.wait { background: var(--warn); animation: pulse .7s infinite; }
	@keyframes pulse { 50% { opacity: .3; } }
	#state { font-weight: 600; font-size: 13.5px; }
	#count { margin-left: auto; font-size: 11.5px; color: var(--faint); }

	#label {
		padding: 8px 12px; font-size: 12.5px; color: var(--accent);
		border-bottom: 1px solid var(--line); flex: 0 0 auto;
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	#label:empty { display: none; }

	#feed { flex: 1; overflow-y: auto; padding: 8px 12px 12px; }
	.row { padding: 7px 0; border-bottom: 1px solid var(--line); }
	.row:last-child { border-bottom: none; }
	.row .k { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
	.row .v { font-size: 12.5px; word-break: break-word; }
	.row.tool .v { color: var(--text); }
	.row.think .v { color: var(--muted); font-style: italic; }
	.row.perm .v { color: var(--warn); }
	.row.err .v { color: #EB7C72; }
	.stream { color: var(--muted); white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
	.empty { color: var(--faint); text-align: center; padding: 28px 10px; font-size: 12.5px; }

	footer { flex: 0 0 auto; padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
	button {
		flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--line);
		background: var(--surface); color: var(--text); font-size: 12.5px; font-family: inherit;
	}
	button:active { background: #1D2823; }
</style>
</head>
<body>
	<header>
		<i id="dot" class="dot"></i>
		<span id="state">连接中…</span>
		<span id="count"></span>
	</header>
	<div id="label"></div>
	<div id="feed"><div class="empty">等待助手动作…</div></div>
	<footer>
		<button id="btn-open">打开对话</button>
		<button id="btn-clear">清空</button>
	</footer>

<script>
const $ = (s) => document.querySelector(s);
const feed = $('#feed');
const MAX_ROWS = 40;
let streamRow = null;      // the row currently accumulating assistant/thinking text
let streamKind = '';
let empty = true;

function clearEmpty() {
	if (!empty) return;
	feed.innerHTML = '';
	empty = false;
}
function trim() {
	while (feed.children.length > MAX_ROWS) feed.removeChild(feed.firstChild);
}
function atBottom() {
	return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
}
function addRow(cls, k, v) {
	clearEmpty();
	const stick = atBottom();
	const d = document.createElement('div');
	d.className = 'row ' + cls;
	d.innerHTML = '<div class="k"></div><div class="v"></div>';
	d.querySelector('.k').textContent = k;
	d.querySelector('.v').textContent = v;
	feed.appendChild(d);
	trim();
	if (stick) feed.scrollTop = feed.scrollHeight;
	return d;
}
// Assistant text and thinking arrive as many small deltas; append them into one
// growing row instead of spamming a row per delta.
function appendStream(kind, text) {
	if (streamKind !== kind || !streamRow) {
		streamRow = addRow(kind === 'think' ? 'think' : '', kind === 'think' ? '思考' : '回复', '');
		streamRow.querySelector('.v').classList.add('stream');
		streamKind = kind;
	}
	const stick = atBottom();
	streamRow.querySelector('.v').textContent += text;
	if (stick) feed.scrollTop = feed.scrollHeight;
}
function endStream() { streamRow = null; streamKind = ''; }

function setState(state, label, count) {
	const dot = $('#dot');
	dot.className = 'dot' + (state === 'RUNNING' ? ' run' : state === 'WAITING' ? ' wait' : '');
	$('#state').textContent = state === 'RUNNING' ? '正在执行' : state === 'WAITING' ? '等待确认' : '空闲';
	$('#label').textContent = label || '';
	$('#count').textContent = count > 1 ? count + ' 个任务并行' : '';
}

async function pollState() {
	try {
		const t = await fetch('/api/overlay-status', { cache: 'no-store' }).then((r) => r.text());
		const [state, label, count] = t.split('\t');
		setState(state, label, Number(count) || 0);
	} catch { /* server down; SSE handler reports it */ }
}

function connect() {
	const es = new EventSource('/api/events');
	es.onopen = () => pollState();
	es.onerror = () => { $('#state').textContent = '连接断开'; $('#dot').className = 'dot'; };
	es.onmessage = (e) => {
		let m; try { m = JSON.parse(e.data); } catch { return; }
		switch (m.type) {
			case 'user_echo': endStream(); addRow('', '你说', m.text || ''); pollState(); break;
			case 'tool_use':
				endStream();
				addRow('tool', '工具 · ' + (m.name || ''), m.title || m.detail || '');
				pollState();
				break;
			case 'tool_result':
				if (!m.ok) addRow('err', '工具出错', (m.summary || '').slice(0, 200));
				break;
			case 'thinking_delta': appendStream('think', m.text || ''); break;
			case 'assistant_delta': appendStream('text', m.text || ''); break;
			case 'assistant_text': endStream(); addRow('', '回复', m.text || ''); break;
			case 'assistant_end': endStream(); break;
			case 'permission': addRow('perm', '需要你确认', m.title || m.name || ''); pollState(); break;
			case 'permission_resolved': pollState(); break;
			case 'error': addRow('err', '出错', m.message || ''); pollState(); break;
			case 'result': endStream(); pollState(); break;
		}
	};
}

$('#btn-clear').onclick = () => { feed.innerHTML = '<div class="empty">已清空</div>'; empty = true; endStream(); };
// The host app listens for this and brings the main chat window to the front.
$('#btn-open').onclick = () => { location.href = 'k70u://open-chat'; };

connect();
pollState();
setInterval(pollState, 4000);
</script>
</body>
</html>
