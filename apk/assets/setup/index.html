<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>DroidAgent</title>
<script>
	// Theme before first paint. WebView's prefers-color-scheme doesn't track the system reliably,
	// so the app reports night mode itself.
	(function () {
		var dark = false;
		try { dark = window.AgentHost && AgentHost.isNight ? AgentHost.isNight() : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { }
		document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
	})();
</script>
<style>
	:root {
		--bg: #F5F6F2; --surface: #FFFFFF; --surface-2: #E9ECE5; --line: #DCE0D7;
		--text: #17201B; --muted: #5B6760; --faint: #8C978F;
		--brand: #0F3B2D; --gold: #E2B33C; --gold-ink: #2A1F04;
		--ok: #23845B; --danger: #BE3F35;
		--safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
	}
	:root[data-theme="dark"] {
		--bg: #0D1411; --surface: #141D19; --surface-2: #1E2924; --line: #26332D;
		--text: #E6ECE8; --muted: #9AA8A0; --faint: #66746D;
		--ok: #5FD3A6; --danger: #EB7C72;
	}
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { margin: 0; min-height: 100%; }
	body {
		background: var(--bg); color: var(--text);
		font-family: system-ui, -apple-system, "MiSans", "HarmonyOS Sans SC", "Noto Sans CJK SC", "PingFang SC", sans-serif;
		font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
	}
	main {
		max-width: 460px; margin: 0 auto;
		padding: calc(var(--safe-top) + 56px) 24px calc(var(--safe-bot) + 32px);
		min-height: 100dvh; display: flex; flex-direction: column;
	}
	.mark { width: 56px; height: 56px; border-radius: 14px; display: block; }
	h1 { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; margin: 28px 0 8px; }
	.lede { color: var(--muted); margin: 0; font-size: 15px; }

	/* checking: just the mark while we see whether the backend is already up */
	body.checking .when-ready { visibility: hidden; }
	body.checking .mark { animation: breathe 1.6s ease-in-out infinite; }
	@keyframes breathe { 50% { opacity: .55; } }

	ol.steps { list-style: none; margin: 36px 0 0; padding: 0; }
	.step { position: relative; display: grid; grid-template-columns: 28px 1fr; column-gap: 14px; padding-bottom: 22px; }
	.step:last-child { padding-bottom: 0; }
	/* the rail joining one step to the next */
	.step:not(:last-child)::before {
		content: ""; position: absolute; left: 13.5px; top: 32px; bottom: 4px; width: 1px; background: var(--line);
	}
	.step.done:not(:last-child)::before { background: var(--ok); opacity: .5; }
	.dot {
		position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
		font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
		border: 1.5px solid var(--line); color: var(--faint); background: var(--bg);
	}
	.step.active .dot { border-color: var(--gold); color: var(--text); }
	.step.active .dot::after {
		content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
		border: 2px solid transparent; border-top-color: var(--gold); animation: spin .9s linear infinite;
	}
	.step.done .dot { background: var(--ok); border-color: var(--ok); color: var(--bg); }
	.step.error .dot { background: var(--danger); border-color: var(--danger); color: #fff; }
	@keyframes spin { to { transform: rotate(360deg); } }
	.dot svg { width: 14px; height: 14px; }
	.label { font-size: 16px; font-weight: 600; padding-top: 1px; }
	.step.pending .label { color: var(--faint); font-weight: 500; }
	.sub { grid-column: 2; color: var(--muted); font-size: 14px; margin-top: 2px; }
	.sub:empty { display: none; }

	.bar { grid-column: 2; margin-top: 12px; }
	.track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
	.fill { height: 100%; width: 0; background: var(--gold); border-radius: 4px; transition: width .3s linear; }
	.nums { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
	.pct { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }

	.note { margin-top: 28px; font-size: 13px; color: var(--faint); }
	.note:empty { display: none; }

	.problem { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 20px; }
	.problem p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
	button.primary {
		appearance: none; border: 0; border-radius: 12px; padding: 13px 22px; min-width: 132px;
		font: inherit; font-weight: 650; font-size: 15px; background: var(--gold); color: var(--gold-ink);
	}
	button.primary:active { filter: brightness(.94); }
	button.primary:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
	details { margin-top: 18px; }
	summary { color: var(--muted); font-size: 14px; cursor: pointer; }
	pre {
		margin: 10px 0 0; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
		font: 12px/1.5 ui-monospace, "JetBrains Mono", "Droid Sans Mono", monospace; color: var(--muted);
		white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto;
	}
	.hidden { display: none !important; }
	@media (prefers-reduced-motion: reduce) {
		.step.active .dot::after, body.checking .mark { animation: none; }
		.fill { transition: none; }
	}
</style>
</head>
<body class="checking">
<main>
	<svg class="mark" viewBox="0 0 108 108" role="img" aria-label="DroidAgent">
		<rect width="108" height="108" rx="24" fill="#0F3B2D"/>
		<path d="M43.6 36.4 L39.2 71.6 M56.8 36.4 L52.4 71.6 M32 46.9 H64 M29.8 61.2 H61.8" fill="none" stroke="#F3F5EF" stroke-width="6.8" stroke-linecap="round"/>
		<rect x="68.3" y="40.8" width="12.1" height="30.8" rx="1.8" fill="#E2B33C"/>
	</svg>

	<div class="when-ready">
		<h1 id="title">正在启动</h1>
		<p class="lede" id="lede"></p>

		<ol class="steps" id="steps">
			<li class="step pending" data-step="root">
				<span class="dot">1</span><span class="label">获取 Root 权限</span><span class="sub"></span>
			</li>
			<li class="step pending" data-step="unpack">
				<span class="dot">2</span><span class="label">解压 Linux 系统</span><span class="sub"></span>
				<div class="bar hidden" id="bar">
					<div class="track"><div class="fill" id="fill"></div></div>
					<div class="nums"><span class="pct" id="pct">0%</span><span id="amount"></span></div>
				</div>
			</li>
			<li class="step pending" data-step="start">
				<span class="dot">3</span><span class="label">启动助手服务</span><span class="sub"></span>
			</li>
		</ol>

		<p class="note" id="note"></p>

		<section class="problem hidden" id="problem">
			<p id="problem-msg"></p>
			<button class="primary" id="retry" type="button">重试</button>
			<details id="log-wrap" class="hidden">
				<summary>查看日志</summary>
				<pre id="log"></pre>
			</details>
		</section>
	</div>
</main>

<script>
(function () {
	'use strict';
	var host = window.AgentHost;
	var $ = function (id) { return document.getElementById(id); };
	var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
	var CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
	var rate = 0; // smoothed bytes/ms, for the time estimate
	var last = '';

	function size(b) {
		if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
		return Math.round(b / 1048576) + ' MB';
	}
	function duration(ms) {
		var s = Math.max(1, Math.round(ms / 1000));
		if (s < 60) return '约 ' + s + ' 秒';
		var m = Math.floor(s / 60), r = s % 60;
		return '约 ' + m + ' 分' + (m < 3 && r >= 10 ? ' ' + r + ' 秒' : '钟');
	}

	function render(st) {
		document.body.classList.toggle('checking', st.phase === 'checking' || st.phase === 'done');
		$('title').textContent = st.phase === 'error' ? st.title : (st.firstRun ? '正在准备 DroidAgent' : st.title);
		$('lede').textContent = st.firstRun ? '第一次打开需要把内置的 Linux 系统解压到本机，只做一次，不需要联网。' : '';

		// Steps. The unpack step only exists on a first run.
		var steps = st.steps || {};
		var items = document.querySelectorAll('.step');
		var n = 0;
		for (var i = 0; i < items.length; i++) {
			var li = items[i], name = li.getAttribute('data-step'), s = steps[name] || 'pending';
			var shown = !(name === 'unpack' && (!st.firstRun || s === 'skip'));
			li.classList.toggle('hidden', !shown);
			if (!shown) continue;
			n++;
			li.className = 'step ' + s;
			var dot = li.querySelector('.dot');
			dot.innerHTML = s === 'done' ? CHECK : s === 'error' ? CROSS : String(n);
			li.querySelector('.sub').textContent =
				s === 'active' && name !== 'unpack' ? (st.message || '') :
				s === 'active' && name === 'unpack' ? '' :
				s === 'done' && name === 'root' ? '已获得授权' : '';
		}

		// Progress for the unpack.
		var p = st.progress || {};
		var unpacking = steps.unpack === 'active' && p.total > 0;
		$('bar').classList.toggle('hidden', !unpacking);
		if (unpacking) {
			var frac = Math.min(1, p.done / p.total);
			$('fill').style.width = (frac * 100).toFixed(1) + '%';
			$('pct').textContent = Math.floor(frac * 100) + '%';
			var cur = p.elapsedMs > 0 ? p.done / p.elapsedMs : 0;
			rate = rate ? rate * 0.85 + cur * 0.15 : cur;
			var left = rate > 0 && p.elapsedMs > 3000 ? ' · 还需' + duration((p.total - p.done) / rate) : '';
			$('amount').textContent = size(p.done) + ' / ' + size(p.total) + left;
		}
		$('note').textContent = unpacking ? '解压时请保持此页面打开，屏幕会保持常亮。' : '';

		// Failure.
		var failed = st.phase === 'error';
		$('problem').classList.toggle('hidden', !failed);
		if (failed) {
			$('problem-msg').textContent = st.message || '';
			$('log').textContent = st.detail || '';
			$('log-wrap').classList.toggle('hidden', !st.detail);
		}
	}

	function poll() {
		if (!host) return;
		var raw;
		try { raw = host.state(); } catch (e) { return; }
		if (raw !== last) {
			last = raw;
			try { render(JSON.parse(raw)); } catch (e) { }
		}
	}

	$('retry').addEventListener('click', function () {
		rate = 0;
		if (host) host.retry();
		poll();
	});

	poll();
	setInterval(poll, 250);
})();
</script>
</body>
</html>
